<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 700px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f9f9f9;
      padding: 20px;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      font-size: 18px;
      color: #333;
    }

    .back-btn {
      padding: 8px 12px;
      background: #e5e7eb;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }

    .back-btn:hover {
      background: #d1d5db;
    }

    .section {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 16px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .section h2 {
      font-size: 14px;
      font-weight: 600;
      color: #333;
    }

    .hint {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 12px;
      line-height: 1.5;
    }

    .btn-reset {
      padding: 6px 10px;
      background: #fee2e2;
      color: #991b1b;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }

    .btn-reset:hover {
      background: #fecaca;
    }

    .btn-reset:disabled {
      background: #f3f4f6;
      color: #9ca3af;
      cursor: default;
    }

    .item-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 300px;
      overflow-y: auto;
    }

    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 4px;
    }

    .item-text {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      min-width: 0;
    }

    .item-name {
      font-size: 13px;
      font-weight: 600;
      color: #111827;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .item-id {
      font-size: 12px;
      font-family: monospace;
      color: #6b7280;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .item-remove {
      padding: 4px 8px;
      background: #fee2e2;
      color: #991b1b;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }

    .item-remove:hover {
      background: #fecaca;
    }

    .empty-state {
      text-align: center;
      padding: 20px;
      color: #999;
      font-size: 13px;
    }

  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Allowlist</h1>
      <button class="back-btn" id="backBtn">← Back</button>
    </div>

    <div class="section">
      <div class="section-header">
        <h2>Allowlisted Channels</h2>
        <button class="btn-reset" id="clearChannelsBtn">Reset channels</button>
      </div>
      <div class="hint">Videos from these channels are never hidden. Add one with the "C" button on any thumbnail.</div>
      <div class="item-list" id="channelList">
        <div class="empty-state">No allowlisted channels</div>
      </div>
    </div>

    <div class="section">
      <div class="section-header">
        <h2>Allowlisted Videos</h2>
        <button class="btn-reset" id="clearVideosBtn">Reset videos</button>
      </div>
      <div class="hint">These videos are never hidden. Add one with the "V" button on any thumbnail.</div>
      <div class="item-list" id="videoList">
        <div class="empty-state">No allowlisted videos</div>
      </div>
    </div>
  </div>

  <script src="allowlist-manager.js"></script>
</body>
</html>
